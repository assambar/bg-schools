# Grade ladder per education system. Labels live in domains/schools/i18n/<lang>.json (grade.<id>).
# `age` is the age the child turns in the calendar year the school year starts.
systems:
  bg:
    - { id: nursery, age_min: 1, age_max: 3 }
    - { id: group1, age: 3 }
    - { id: group2, age: 4 }
    - { id: pg1, age: 5 }
    - { id: pg2, age: 6 }
    - { id: grade1, age: 7 }
    - { id: grade2, age: 8 }
    - { id: grade3, age: 9 }
    - { id: grade4, age: 10 }
    - { id: grade5, age: 11 }
    - { id: grade6, age: 12 }
    - { id: grade7, age: 13 }
    - { id: grade8, age: 14 }
    - { id: grade9, age: 15 }
    - { id: grade10, age: 16 }
    - { id: grade11, age: 17 }
    - { id: grade12, age: 18 }
