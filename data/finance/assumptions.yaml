# Inputs of the Finance page (src/pathways/finance.ts) and of the build-time diagrams.
# Every number is either cited (see `sources`) or an explicit ASSUMPTION the page lets you change.
# The reference calculator scripts/pathways/finance-reference.py uses the same values; the unit tests
# check that both give the same results for these defaults.

defaults:                       # adjustable on the Finance page
  monthly_per_child: 1000       # EUR per child per month
  kids: 2
  months_per_year: 9            # contributions in school months (Sep-May); 12 allowed
  child2_offset_years: 2        # ASSUMPTION: the second child starts PG2 two years later
  fee_growth: 0.05              # ASSUMPTION: school fees grow 5% a year (scenario range 3-7%)
  scenario: base                # return scenario: pessimistic | cautious | base | optimistic

fixed:
  start_year: 2027              # school year 2027/28 = PG2 of the first child
  fee_base_year: 2026           # fees below are 2026/27 prices
  horizons: [5, 8, 13]          # PG2 to grade 4, to grade 7, to grade 12
  uni_start_after_years: 13
  degree_years: 4
  contribution_growth: 0        # ASSUMPTION: flat nominal amount
  uni_cost_growth: 0.03         # ASSUMPTION: university tuition and living, per year
  eur_inflation: 0.02           # ASSUMPTION (ECB target), for the real-terms figure
  ter: 0.0007                   # sources.ishares
  capital_gains_tax: 0          # sources.tax: disposal on an EU/EEA regulated market is not taxed
  loan_apr: 0.0942              # sources.bnb (consumer loans, APR)
  loan_term_years: 5            # ASSUMPTION: typical consumer-loan term
  mortgage_apr: 0.0277          # sources.bnb (housing loans, APR)
  mortgage_term_years: 25       # ASSUMPTION
  sofia_eur_per_m2: 2680        # sources.sofia_prices (market portal, not official)
  rent_yield_gross: [0.04, 0.06]  # sources.sofia_prices
  avg_gross_wage_eur: 1444      # sources.nsi_wage
  tutoring_per_year: 1850       # sources.tutoring (math school, 9 months; via search summary)
  fx: { USD: 1.1186, GBP: 0.84698, CHF: 0.9326 }   # sources.ecb, units per EUR

# Per-year cost of a university at 2026/27 prices, local currency (tuition, then living).
universities:
  - { id: tu-delft, tuition: [2694, 2694, EUR], living: [10908, 10908, EUR] }       # living 909 x 12
  - { id: tum, tuition: [194, 194, EUR], living: [15600, 24000, EUR] }              # semester fee 97 x 2; living 1,300-2,000 x 12
  - { id: ku-leuven, tuition: [1181.4, 1181.4, EUR], living: [12600, 16800, EUR] }  # living 1,050-1,400 x 12
  - { id: eth-zurich, tuition: [4528, 4528, CHF], living: [23572, 23572, CHF] }     # ETH group-2 total CHF 28,100
  - { id: bocconi, tuition: [17000, 17000, EUR] }                                   # living not published here
  - { id: oxford, tuition: [37380, 62820, GBP], living: [12645, 18945, GBP] }       # living 1,405-2,105 x 9
  - { id: imperial, tuition: [45500, 45500, GBP], living: [16389, 17037, GBP] }     # living 1,821-1,893 x 9
  - { id: mit, tuition: [92760, 92760, USD], living: [0, 0, USD] }                  # total cost of attendance before aid

sources:
  damodaran: { url: 'https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/histretSP.html', note: 'S&P 500 total return 1928-2025 (data/finance/sp500-total-return.csv)' }
  ishares: { url: 'https://www.ishares.com/uk/individual/en/products/253743', note: 'iShares Core S&P 500 UCITS ETF (CSPX / SXR8): TER 0.07%, accumulating, USD share class' }
  tax: { url: 'https://www.minfin.bg/bg/wreply/2026-07-03/13435', note: 'Income Taxes on Natural Persons Act (ЗДДФЛ) art. 13(1)(3): gains from disposals on EU/EEA regulated markets are not taxable' }
  bnb: { url: 'https://www.bnb.bg/bnbweb/groups/public/documents/bnb_download/202607_s_irs_press_a1_bg.pdf', note: 'BNB, new business July 2026: consumer loans APR 9.42%, housing loans APR 2.77%' }
  ecb: { url: 'https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html', note: 'ECB reference rates, 8 Oct 2026' }
  nsi_wage: { url: 'https://www.nsi.bg/press-release/naeti-lica-i-sredna-rabotna-zaplata-ii-trimesechie-2026-godina-9113', note: 'Average gross monthly wage, Q2 2026: EUR 1,444' }
  nsi_hicp: { url: 'https://www.nsi.bg/en/press-release/inflation-and-consumer-price-indices-9157', note: 'HICP Aug 2026: 5.0% y/y, education services 9.1% y/y (context for the fee-growth assumption)' }
  sofia_prices: { url: 'https://finansovsuvet.com/imoti-sofia/', note: 'Market portal, not official: about EUR 2,680/m2, gross rental yield 4-6%' }
  tutoring: { url: 'https://www.horus.bg/', note: 'Math school, EUR 1,850 for 9 months (via search summary; verify)' }
